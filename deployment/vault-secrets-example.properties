# Example vault-secrets.properties file
# This file is mounted by the secret manager at /var/secrets/vault-secrets.properties

# Snowflake connection properties
snowflake.url=jdbc:snowflake://dev.east.company.com/?warehouse=BT_WT&db=SSFF&schema=MY_SCM
snowflake.username=myuser
snowflake.passphrase=your-encrypted-passphrase

# Private key stored inline (will be extracted by startup script)
# Format: key.LINE1, key.LINE2, etc.
key.1=-----BEGIN ENCRYPTED PRIVATE KEY-----
key.2=MIIFHDBOBgkqhkiG9w0BBQ0wQTApBgkqhkiG9w0BBQwwHAQIexampledata1CAg
key.3=gAMCAggAMAwGCCqGSIb3DQIJBQAwFAYIKoZIhvcNAwcECExampleData2
key.4=BIIEyExampleEncryptedKeyDataHereThisIsJustAnExample
key.5=ExampleMoreEncryptedDataContinuesHereForMultipleLines
key.6=-----END ENCRYPTED PRIVATE KEY-----

# Path where the key will be extracted (set by startup script)
snowflake.private-key-path=/var/secrets/snowflake_key.p8

# Input file path
batch.input.file-path=/data/orders.txt