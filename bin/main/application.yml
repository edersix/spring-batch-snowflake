spring:
  application:
    name: order-status-batch
  
  # Import additional properties from vault-secrets.properties
  config:
    import: optional:file:/var/secrets/vault-secrets.properties
  
  # Primary datasource (local database for batch metadata and comparison)
  datasource:
    primary:
      url: jdbc:h2:mem:batchdb
      username: sa
      password:
      driver-class-name: org.h2.Driver
    
    # Snowflake datasource configuration
    # Properties can be overridden by vault-secrets.properties
    snowflake:
      url: ${snowflake.url:jdbc:snowflake://dev.east.company.com/?warehouse=BT_WT&db=SSFF&schema=MY_SCM}
      username: ${snowflake.username:myuser}
      # Private key path from vault-secrets.properties or environment variable
      private-key-path: ${snowflake.private-key-path:${PRIVATE_KEY_PATH:/vault/secrets/snowflake_key.p8}}
      # Passphrase from vault-secrets.properties or environment variable
      passphrase: ${snowflake.passphrase:${PASSPHRASE}}
      # HikariCP pool settings
      pool:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000   # 30s — max wait for a connection from the pool
        idle-timeout: 600000        # 10m — how long idle connections are kept
        max-lifetime: 1800000       # 30m — max connection lifetime (less than Snowflake's session timeout)
  
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # Batch configuration
  batch:
    job:
      enabled: false  # Disable auto-run, we'll trigger manually or via scheduler
    jdbc:
      initialize-schema: always  # Create batch metadata tables

# Logging configuration
logging:
  level:
    root: INFO
    com.company: DEBUG
    org.springframework.batch: INFO
    org.hibernate.SQL: DEBUG
    net.snowflake: INFO

# Application-specific properties
batch:
  input:
    file-path: ${INPUT_FILE_PATH:/data/orders.txt}
  chunk-size: 100
  schedule:
    cron: "0 0 2 * * ?"
  
# OpenShift/Kubernetes health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized